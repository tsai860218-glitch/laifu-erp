<script>
/* =======================================================================
   資料存取層：Firestore → localStorage → 記憶體
   ======================================================================= */
const COLLECTIONS = ['products','categories','brands','batches','movements','customers','companies','quotes','shipments','counters'];
let BACKEND='memory', db=null;
const mem={}; COLLECTIONS.forEach(c=>mem[c]=[]);
function lsOK(){ try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;} }
async function dalInit(){
  if (firebaseConfig && firebaseConfig.apiKey && window.firebase){
    try{ firebase.initializeApp(firebaseConfig); db=firebase.firestore(); BACKEND='firestore'; return; }
    catch(e){ console.warn('Firebase 初始化失敗，改用本機儲存',e); }
  }
  BACKEND = lsOK() ? 'localStorage' : 'memory';
}
async function dalList(c){
  if(BACKEND==='firestore'){ const s=await db.collection(c).get(); return s.docs.map(d=>d.data()); }
  if(BACKEND==='localStorage'){ try{return JSON.parse(localStorage.getItem('erp_'+c)||'[]');}catch(e){return [];} }
  return mem[c].slice();
}
async function dalPut(c,obj){
  if(BACKEND==='firestore'){ await db.collection(c).doc(String(obj.id)).set(JSON.parse(JSON.stringify(obj))); return obj; }
  const arr = BACKEND==='localStorage' ? JSON.parse(localStorage.getItem('erp_'+c)||'[]') : mem[c];
  const i=arr.findIndex(x=>x.id===obj.id); if(i>=0)arr[i]=obj; else arr.push(obj);
  if(BACKEND==='localStorage') localStorage.setItem('erp_'+c, JSON.stringify(arr));
  return obj;
}

/* ===== 狀態 ===== */
const store={}; COLLECTIONS.forEach(c=>store[c]=[]);
let operator = (typeof localStorage!=='undefined' && localStorage.getItem('erp_operator')) || '';
let currentView='products';
let draftQuote=null, draftShip=null;
async function loadAll(){ for(const c of COLLECTIONS) store[c]=await dalList(c); }

/* ===== 工具 ===== */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowISO=()=>new Date().toISOString();
const pad=(n,l)=>String(n).padStart(l,'0');
function debounce(fn,ms){ let t; return function(){ clearTimeout(t); t=setTimeout(fn,ms); }; }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`; }
function addDaysStr(base,days){ const d=new Date(base+'T00:00:00'); d.setDate(d.getDate()+days); return `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`; }
function fmtDate(s){ if(!s)return'—'; const d=s.length>10?new Date(s):new Date(s+'T00:00:00'); if(isNaN(d))return s; return `${d.getFullYear()}/${pad(d.getMonth()+1,2)}/${pad(d.getDate(),2)}`; }
function fmtDT(s){ if(!s)return'—'; const d=new Date(s); if(isNaN(d))return s; return `${d.getFullYear()}/${pad(d.getMonth()+1,2)}/${pad(d.getDate(),2)} ${pad(d.getHours(),2)}:${pad(d.getMinutes(),2)}`; }
function nt(n){ return 'NT$ '+(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2}); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
async function nextNo(prefix,{year=null,pad:p=5}={}){
  const name=year?`${prefix}${year}`:prefix;
  let c=store.counters.find(x=>x.id===name); if(!c){c={id:name,value:0};store.counters.push(c);}
  c.value++; await dalPut('counters',c);
  return year?`${prefix}${year}${pad(c.value,p)}`:`${prefix}${pad(c.value,p)}`;
}
const batchesOf=id=>store.batches.filter(b=>b.productId===id && !b.isDeleted);
const stockOf=id=>batchesOf(id).reduce((s,b)=>s+(b.remainingQty||0),0);
const catName=id=>{ const c=store.categories.find(x=>x.id===id); return c?c.name:'—'; };
const brandName=id=>{ const b=store.brands.find(x=>x.id===id); return b?b.name:'—'; };
const productById=id=>store.products.find(p=>p.id===id);
/* 商品類型：stock=庫存商品（管庫存、出貨扣庫存）／nonstock=非庫存商品（接單採購，不管庫存） */
const isStockProduct=p=>!!p && (p.type||'stock')==='stock';
const isStockPid=id=>isStockProduct(productById(id));
const stockText=p=>isStockProduct(p)?String(stockOf(p.id)):'非庫存';
const customerById=id=>store.customers.find(c=>c.id===id);
const companyById=id=>store.companies.find(c=>c.id===id);

/* ===== FIFO 引擎（已單元測試） ===== */
function computeFifoDeduction(batches,qtyNeeded){
  const sorted=batches.filter(b=>b.remainingQty>0).sort((a,b)=> a.purchaseDate!==b.purchaseDate ? (a.purchaseDate<b.purchaseDate?-1:1) : (a.createdAt||0)-(b.createdAt||0));
  let need=qtyNeeded; const consumptions=[];
  for(const b of sorted){ if(need<=0)break; const take=Math.min(b.remainingQty,need); if(take>0){consumptions.push({batch:b,qty:take,unitCost:b.unitCost});need-=take;} }
  return { ok:need<=0, consumptions, shortage:Math.max(0,need) };
}
async function addMovement(m){ const rec=Object.assign({id:uid(),createdAt:nowISO(),operator:operator||'（未設定）'},m); store.movements.push(rec); await dalPut('movements',rec); return rec; }
async function touchProduct(p){ p.updatedAt=nowISO(); p.updatedBy=operator||'（未設定）'; await dalPut('products',p); }
async function doPurchase({productId,vendorName,purchaseDate,unitCost,qty,note}){
  const p=productById(productId); if(!p) throw new Error('找不到商品');
  if(!isStockProduct(p)) throw new Error(`「${p.name}」是非庫存商品（接單採購），不管理庫存，不需建立進貨批次。`);
  const code=await nextNo('I',{year:new Date().getFullYear(),pad:5});
  const before=stockOf(productId);
  const batch={id:uid(),code,productId,vendorName:vendorName||'',purchaseDate,unitCost:Number(unitCost)||0,qty:Number(qty),remainingQty:Number(qty),note:note||'',isDeleted:false,createdAt:nowISO(),createdBy:operator||'（未設定）'};
  store.batches.push(batch); await dalPut('batches',batch); await touchProduct(p);
  await addMovement({date:purchaseDate,productId,productCode:p.code,productName:p.name,type:'進貨',qty:Number(qty),stockBefore:before,stockAfter:before+Number(qty),sourceNo:code,batchId:batch.id,batchCode:code,unitCost:Number(unitCost)||0,reason:note||''});
  return batch;
}
async function doDeduct({productId,qty,type,sourceNo,reason}){
  const p=productById(productId); if(!p) throw new Error('找不到商品'); qty=Number(qty);
  if(!isStockProduct(p)) throw new Error(`「${p.name}」是非庫存商品（接單採購），不管理庫存。`);
  const plan=computeFifoDeduction(batchesOf(productId),qty);
  if(!plan.ok) throw new Error(`「${p.name}」庫存不足，尚缺 ${plan.shortage} 個（目前 ${stockOf(productId)}）`);
  let run=stockOf(productId);
  for(const c of plan.consumptions){
    c.batch.remainingQty-=c.qty; await dalPut('batches',c.batch);
    const before=run; run-=c.qty;
    await addMovement({date:todayStr(),productId,productCode:p.code,productName:p.name,type,qty:-c.qty,stockBefore:before,stockAfter:run,sourceNo:sourceNo||'',batchId:c.batch.id,batchCode:c.batch.code,unitCost:c.unitCost,reason:reason||''});
  }
  await touchProduct(p); return plan;
}
async function doPositiveAdjust({productId,qty,unitCost,reason}){
  const p=productById(productId); if(!isStockProduct(p)) throw new Error(`「${p?.name||''}」是非庫存商品（接單採購），不管理庫存。`);
  qty=Number(qty); const before=stockOf(productId);
  const batch={id:uid(),code:'ADJ',productId,vendorName:'',purchaseDate:todayStr(),unitCost:Number(unitCost)||0,qty,remainingQty:qty,note:'庫存調整（增加）',isDeleted:false,createdAt:nowISO(),createdBy:operator||'（未設定）'};
  store.batches.push(batch); await dalPut('batches',batch); await touchProduct(p);
  await addMovement({date:todayStr(),productId,productCode:p.code,productName:p.name,type:'調整',qty,stockBefore:before,stockAfter:before+qty,sourceNo:'',batchId:batch.id,batchCode:'ADJ',unitCost:Number(unitCost)||0,reason:reason||''});
}
/* 初始庫存：現貨 / 寄倉 / 盤點建立，不需要進貨單 */
async function createInitialStock(p,qty,unitCost,note){
  qty=Number(qty)||0; if(qty<=0) return null;
  if(!isStockProduct(p)) return null;
  const before=stockOf(p.id);
  const batch={id:uid(),code:'INIT',productId:p.id,vendorName:p.vendorName||'',purchaseDate:todayStr(),
    unitCost:Number(unitCost)||0,qty,remainingQty:qty,note:note||'初始建立',isDeleted:false,createdAt:nowISO(),createdBy:operator||'（未設定）'};
  store.batches.push(batch); await dalPut('batches',batch);
  await addMovement({date:todayStr(),productId:p.id,productCode:p.code,productName:p.name,type:'初始建立',qty,
    stockBefore:before,stockAfter:before+qty,sourceNo:'',batchId:batch.id,batchCode:'INIT',unitCost:Number(unitCost)||0,reason:note||'初始建立庫存'});
  return batch;
}

async function confirmShipment(sh){
  if(sh.stockDeducted) throw new Error('此出貨單已確認並扣過庫存，不可重複扣。');
  /* 只有「庫存商品」扣庫存；非庫存商品（接單採購）與自訂項目不扣 */
  const tracked=sh.items.filter(it=>it.productId && isStockPid(it.productId));
  /* 同一商品可能出現在多列（例如多個報價項目的內部明細都用到），
     必須先合併需求量再檢查，否則逐列檢查會誤判可出貨、造成扣到一半才失敗 */
  const demand={};
  tracked.forEach(it=>{ demand[it.productId]=(demand[it.productId]||0)+(Number(it.qty)||0); });
  for(const pid of Object.keys(demand)){
    const plan=computeFifoDeduction(batchesOf(pid).map(b=>({...b})),demand[pid]);
    if(!plan.ok){ const p=productById(pid);
      throw new Error(`「${p?.name||pid}」庫存不足：本單需要 ${demand[pid]}，現有 ${stockOf(pid)}，尚缺 ${plan.shortage}。整張出貨單未扣庫存。`); }
  }
  for(const it of tracked){ await doDeduct({productId:it.productId,qty:Number(it.qty),type:'出貨',sourceNo:sh.no,reason:sh.customerSnapshot?.name||''}); }
  sh.stockDeducted=true; sh.status='已確認出貨'; sh.updatedAt=nowISO(); sh.updatedBy=operator||'（未設定）';
  await dalPut('shipments',sh);
  if(sh.quoteId){ const q=store.quotes.find(x=>x.id===sh.quoteId); if(q){ q.status='已出貨'; await dalPut('quotes',q); } }
}

/* ===== 刪除庫存異動：同步回復庫存（回補批次 / 移除批次） ===== */
async function deleteMovement(id){
  const m=store.movements.find(x=>x.id===id); if(!m||m.isDeleted) return;
  /* 已確認出貨單的異動：一張單會有多筆（FIFO 跨批次），只刪其中一筆會讓庫存只回復一半、
     出貨單卻還是「已確認」。改由出貨單整張回復。 */
  if(m.sourceNo){
    const sh=store.shipments.find(x=>x.no===m.sourceNo && !x.isDeleted && x.stockDeducted);
    if(sh){ alert(`此筆異動來自已確認的出貨單「${sh.no}」，不可單獨刪除（會造成庫存只回復一部分）。\n\n請到「出貨管理」開啟該出貨單，使用「取消出貨（回復庫存）」，一次回復整張單的庫存。`); return; }
  }
  const b=store.batches.find(x=>x.id===m.batchId);
  if(!b || b.isDeleted){ alert('找不到此異動對應的進貨批次，無法安全回復庫存，已中止。'); return; }
  if(m.qty>0){
    const used=b.qty-b.remainingQty;
    if(used>0){ alert(`此筆「${m.type}」建立的批次已有 ${used} 個被出貨或調整扣用，不可刪除（會造成庫存計算錯誤）。\n\n請先刪除相關的出貨／調整異動，再回來刪除此筆。`); return; }
    if(!confirm(`是否確定刪除此筆庫存異動？\n\n${m.type}　${m.productName}　+${m.qty}\n\n此操作將回復該筆庫存異動造成的庫存變化（庫存將 -${m.qty}，並移除該批次），且無法復原。`)) return;
    b.isDeleted=true; await dalPut('batches',b);
  } else {
    const back=-m.qty;
    if(b.remainingQty+back>b.qty){ alert('回復數量會超過該批次的進貨量，資料異常，已中止。'); return; }
    if(!confirm(`是否確定刪除此筆庫存異動？\n\n${m.type}　${m.productName}　${m.qty}\n\n此操作將回復該筆庫存異動造成的庫存變化（庫存將 +${back}，回補至批次 ${b.code}），且無法復原。`)) return;
    b.remainingQty+=back; await dalPut('batches',b);
  }
  m.isDeleted=true; m.deletedAt=nowISO(); m.deletedBy=operator||'（未設定）';
  await dalPut('movements',m);
  const p=productById(m.productId); if(p) await touchProduct(p);
  render();
}
/* 取消已確認的出貨單：一次回復整張單造成的庫存變化 */
async function reverseShipment(sh){
  if(!sh.stockDeducted) throw new Error('此出貨單尚未確認扣庫存。');
  const ms=store.movements.filter(m=>!m.isDeleted && m.sourceNo===sh.no && m.type==='出貨');
  for(const m of ms){
    const b=store.batches.find(x=>x.id===m.batchId);
    if(!b||b.isDeleted) throw new Error('部分批次已不存在，無法安全回復，已中止。');
    if(b.remainingQty+(-m.qty)>b.qty) throw new Error('回復數量異常，已中止。');
  }
  for(const m of ms){
    const b=store.batches.find(x=>x.id===m.batchId);
    b.remainingQty+=(-m.qty); await dalPut('batches',b);
    m.isDeleted=true; m.deletedAt=nowISO(); m.deletedBy=operator||'（未設定）'; await dalPut('movements',m);
  }
  sh.stockDeducted=false; sh.status='草稿'; sh.updatedAt=nowISO(); sh.updatedBy=operator||'（未設定）';
  await dalPut('shipments',sh);
  if(sh.quoteId){ const q=store.quotes.find(x=>x.id===sh.quoteId); if(q && q.status==='已出貨'){ q.status='已送出'; await dalPut('quotes',q); } }
  return ms.length;
}

function icon(p,cls='w-5 h-5'){ return `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>`; }

    {id:'products',label:'商品管理',icon:IC.box},
    {id:'categories',label:'商品分類',icon:IC.list},
    {id:'brands',label:'品牌管理',icon:IC.tag},

const VIEW_LABEL = id => NAV.flatMap(g=>g.items).find(i=>i.id===id)?.label || (id==='quoteEdit'?'報價單編輯':id==='shipEdit'?'出貨單編輯':'');

  moveType:'',moveProduct:'',moveShowDeleted:false, custSearch:'', quoteSearch:'',quoteStatus:'', shipSearch:'',shipStatus:'' };
const flabel=t=>`<span class="text-sm font-medium text-slate-600 dark:text-slate-300">${t}</span>`;
const IN="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-2 text-sm focus:ring-2 focus:ring-brand-400 outline-none";

function render(){
  const dark=document.documentElement.classList.contains('dark');
  document.getElementById('app').innerHTML=`
  <div class="min-h-screen flex">
    <aside class="hidden md:flex md:w-60 flex-col bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 shrink-0">
      <div class="h-16 flex items-center gap-2 px-5 border-b border-slate-200 dark:border-slate-800">
        <div class="w-8 h-8 rounded-lg bg-brand-600 text-white grid place-items-center font-bold">庫</div>
        <div class="leading-tight"><div class="font-bold text-sm">庫存 / 報價 / 出貨</div><div class="text-[11px] text-slate-400">Web ERP Lite</div></div>
      </div>
      <nav class="p-3 space-y-4 flex-1 overflow-y-auto">
        ${NAV.map(g=>`<div><div class="px-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-1">${g.group}</div>
          <div class="space-y-1">${g.items.map(n=>`
            <button onclick="go('${n.id}')" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition
              ${currentView===n.id?'bg-brand-50 dark:bg-brand-900/40 text-brand-700 dark:text-brand-200':'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}">
              ${icon(n.icon)}<span>${n.label}</span></button>`).join('')}</div></div>`).join('')}
      </nav>
      <div class="p-3 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-400">儲存：<span class="font-medium text-slate-500 dark:text-slate-300">${BACKEND==='firestore'?'Firebase 雲端':BACKEND==='localStorage'?'本機瀏覽器':'記憶體（暫存）'}</span></div>
    </aside>
    <div class="flex-1 min-w-0 flex flex-col">
      <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 md:px-6 gap-3 sticky top-0 z-20">
        <div class="md:hidden"><select onchange="go(this.value)" class="rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-2 py-1.5 text-sm">
          ${NAV.flatMap(g=>g.items).map(n=>`<option value="${n.id}" ${currentView===n.id?'selected':''}>${n.label}</option>`).join('')}</select></div>
        <div class="hidden md:block font-bold text-lg">${VIEW_LABEL(currentView)}</div>
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-1.5 text-sm"><span class="text-slate-400 hidden sm:inline">操作人</span>
            <input value="${esc(operator)}" onchange="setOperator(this.value)" placeholder="輸入姓名" class="w-24 sm:w-32 rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-2.5 py-1.5 text-sm focus:ring-2 focus:ring-brand-400 outline-none" /></div>
          <button onclick="toggleDark()" class="w-9 h-9 grid place-items-center rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">
            ${dark?icon('M12 3v1m0 16v1m9-9h-1M4 12H3m15.36 6.36l-.7-.7M6.34 6.34l-.7-.7m12.72 0l-.7.7M6.34 17.66l-.7.7M12 8a4 4 0 100 8 4 4 0 000-8z'):icon('M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z')}
          </button>
        </div>
      </header>
      <main class="flex-1 p-4 md:p-6 overflow-x-hidden fade-in">
        ${ currentView==='products'?viewProducts()
         : currentView==='categories'?viewCategories()
         : currentView==='brands'?viewBrands()
         : currentView==='batches'?viewBatches()
         : currentView==='movements'?viewMovements()
         : currentView==='customers'?viewCustomers()
         : currentView==='companies'?viewCompanies()
         : currentView==='quotes'?viewQuotes()
         : currentView==='shipments'?viewShipments()
         : currentView==='quoteEdit'?viewQuoteEditor()
         : currentView==='shipEdit'?viewShipEditor() : '' }
      </main>

}
function statCards(cards){ return `<div class="grid grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4 mb-4">${cards.map(c=>`<div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm p-4"><div class="text-xs text-slate-400 mb-1">${c.label}</div><div class="text-2xl font-bold num ${c.danger?'text-rose-600 dark:text-rose-400':''}">${c.value} <span class="text-sm font-normal text-slate-400">${c.sub||''}</span></div></div>`).join('')}</div>`; }

/* =======================================================================
   商品管理（搜尋：debounce + 只重繪結果區，輸入框不重建）
   ======================================================================= */
const debProductSearch=debounce(()=>renderProductResults(),350);
function renderProductResults(){ const el=document.getElementById('product-results'); if(el) el.innerHTML=productResultsHTML(); }
function viewProducts(){
  const live=store.products.filter(p=>!p.isDeleted);
  const stk=live.filter(isStockProduct);
  const lowCount=stk.filter(p=>p.minStock>0&&stockOf(p.id)<p.minStock).length;
  const totalStock=stk.reduce((s,p)=>s+stockOf(p.id),0);
  const nonCount=live.length-stk.length;
  return `${statCards([{label:'商品總數',value:live.length,sub:`項（含非庫存 ${nonCount}）`},{label:'庫存總量',value:totalStock.toLocaleString(),sub:'個（僅庫存商品）'},{label:'低庫存商品',value:lowCount,sub:'項',danger:lowCount>0}])}
  <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
    <div class="p-3 md:p-4 flex flex-col sm:flex-row gap-2 sm:items-center border-b border-slate-100 dark:border-slate-800">
      <div class="relative flex-1">${icon(IC.search,'w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400')}
        <input id="product-search" value="${esc(ui.productSearch)}" oninput="ui.productSearch=this.value;ui.productPage=1;debProductSearch()" onkeydown="if(event.key==='Enter'){ui.productSearch=this.value;ui.productPage=1;renderProductResults();}" placeholder="搜尋料號 / 品名 / 廠商 / 品牌" class="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:ring-2 focus:ring-brand-400 outline-none" /></div>
      <select onchange="ui.productCat=this.value;ui.productPage=1;renderProductResults()" class="rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-2 text-sm"><option value="">全部分類</option>${store.categories.filter(c=>!c.isDeleted).map(c=>`<option value="${c.id}" ${ui.productCat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      <select onchange="ui.productBrand=this.value;ui.productPage=1;renderProductResults()" class="rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-2 text-sm"><option value="">全部品牌</option>${store.brands.filter(b=>!b.isDeleted).map(b=>`<option value="${b.id}" ${ui.productBrand===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>
      <select onchange="ui.productType=this.value;ui.productPage=1;renderProductResults()" class="rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-2 text-sm"><option value="">全部類型</option>${PRODUCT_TYPES.map(t=>`<option value="${t.v}" ${ui.productType===t.v?'selected':''}>${t.v==='stock'?'庫存商品':'非庫存商品'}</option>`).join('')}</select>
      <button onclick="openProductModal()" class="inline-flex items-center gap-1.5 bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">${icon(IC.plus,'w-4 h-4')} 新增商品</button>
    </div>
    <div id="product-results">${productResultsHTML()}</div>
  </div>
  ${store.products.length===0?`<div class="mt-4 text-center"><button onclick="seedDemo()" class="text-sm text-brand-600 hover:underline">＋ 載入範例資料（含客戶預設值、公司、品牌、商品與批次）</button></div>`:''}`;
}
function productResultsHTML(){
  let rows=store.products.filter(p=>!p.isDeleted);
  const q=ui.productSearch.trim().toLowerCase();
  if(q) rows=rows.filter(p=>(p.code+' '+p.name+' '+(p.vendorName||'')+' '+brandName(p.brandId)).toLowerCase().includes(q));
  if(ui.productCat) rows=rows.filter(p=>p.categoryId===ui.productCat);
  if(ui.productBrand) rows=rows.filter(p=>p.brandId===ui.productBrand);
  if(ui.productType) rows=rows.filter(p=>(p.type||'stock')===ui.productType);
  const {key,dir}=ui.productSort;
  rows.sort((a,b)=>{ let va=key==='stock'?stockOf(a.id):(a[key]??''),vb=key==='stock'?stockOf(b.id):(b[key]??''); if(typeof va==='string')va=va.toLowerCase(); if(typeof vb==='string')vb=vb.toLowerCase(); return (va<vb?-1:va>vb?1:0)*(dir==='asc'?1:-1); });
  const total=rows.length,pages=Math.max(1,Math.ceil(total/ui.pageSize)); if(ui.productPage>pages)ui.productPage=pages;
  const pageRows=rows.slice((ui.productPage-1)*ui.pageSize,(ui.productPage-1)*ui.pageSize+ui.pageSize);
  const th=(l,k,x='')=>`<th class="px-3 py-2.5 text-left font-semibold text-slate-500 dark:text-slate-400 select-none cursor-pointer whitespace-nowrap ${x}" onclick="sortProducts('${k}')">${l} ${ui.productSort.key===k?(ui.productSort.dir==='asc'?'▲':'▼'):''}</th>`;
  return `<div class="overflow-x-auto"><table class="w-full text-sm">
    <thead class="bg-slate-50 dark:bg-slate-800/50 border-b border-slate-100 dark:border-slate-800"><tr>${th('料號','code')}${th('品名','name')}<th class="px-3 py-2.5 text-left font-semibold text-slate-500 dark:text-slate-400">分類</th><th class="px-3 py-2.5 text-left font-semibold text-slate-500 dark:text-slate-400">品牌</th><th class="px-3 py-2.5 text-left font-semibold text-slate-500 dark:text-slate-400">進貨廠商</th>${th('售價','price','text-right')}${th('庫存','stock','text-right')}<th class="px-3 py-2.5 text-right font-semibold text-slate-500 dark:text-slate-400">操作</th></tr></thead>
    <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
    ${pageRows.length?pageRows.map(p=>{ const isStk=isStockProduct(p); const st=isStk?stockOf(p.id):null; const low=isStk&&p.minStock>0&&st<p.minStock;
      return `<tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40">
        <td class="px-3 py-2.5 font-mono text-xs text-slate-500 dark:text-slate-400 whitespace-nowrap">${esc(p.code)}</td>
        <td class="px-3 py-2.5 font-medium">${esc(p.name)}${isStk?'':' <span class="text-[10px] align-middle bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-300 px-1.5 py-0.5 rounded font-normal">接單採購</span>'}${p.note?`<div class="text-[11px] text-slate-400 font-normal">${esc(p.note)}</div>`:''}</td>
        <td class="px-3 py-2.5 text-slate-500">${esc(catName(p.categoryId))}</td>
        <td class="px-3 py-2.5 text-slate-500">${p.brandId?esc(brandName(p.brandId)):'—'}</td>
        <td class="px-3 py-2.5 text-slate-500">${esc(p.vendorName||'—')}</td>
        <td class="px-3 py-2.5 text-right num whitespace-nowrap">${nt(p.price)}</td>
        <td class="px-3 py-2.5 text-right num font-semibold whitespace-nowrap ${low?'text-rose-600 dark:text-rose-400':''}">${isStk?`${st}${low?` <span class="inline-block text-[10px] align-middle bg-rose-100 dark:bg-rose-900/50 text-rose-600 dark:text-rose-300 px-1.5 py-0.5 rounded">低於 ${p.minStock}</span>`:''}`:'<span class="text-xs font-normal text-slate-400">不管理</span>'}</td>
        <td class="px-3 py-2.5"><div class="flex items-center justify-end gap-1">
          ${isStk?`<button onclick="openPurchaseModal('${p.id}')" class="px-2 py-1 rounded-md text-xs bg-brand-50 dark:bg-brand-900/40 text-brand-700 dark:text-brand-200 hover:bg-brand-100">進貨</button>
          <button onclick="openDeductModal('${p.id}')" class="px-2 py-1 rounded-md text-xs bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700">出庫</button>
          <button onclick="openBatchesModal('${p.id}')" class="p-1.5 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">${icon(IC.stack,'w-4 h-4')}</button>`:''}
          <button onclick="openProductModal('${p.id}')" class="p-1.5 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">${icon(IC.edit,'w-4 h-4')}</button>
          <button onclick="deleteProduct('${p.id}')" class="p-1.5 rounded-md hover:bg-rose-50 dark:hover:bg-rose-900/30 text-rose-500">${icon(IC.trash,'w-4 h-4')}</button>
        </div></td></tr>`;
    }).join(''):`<tr><td colspan="8" class="px-3 py-16 text-center text-slate-400">${store.products.filter(p=>!p.isDeleted).length===0?'尚無商品。點右上角「新增商品」，或下方載入範例資料。':'沒有符合條件的商品。'}</td></tr>`}
    </tbody></table></div>
  ${total>ui.pageSize?`<div class="p-3 flex items-center justify-between text-sm border-t border-slate-100 dark:border-slate-800"><span class="text-slate-400">共 ${total} 筆，第 ${ui.productPage} / ${pages} 頁</span><div class="flex gap-1"><button onclick="ui.productPage=Math.max(1,ui.productPage-1);renderProductResults()" class="px-3 py-1 rounded-md border border-slate-300 dark:border-slate-700 disabled:opacity-40" ${ui.productPage<=1?'disabled':''}>上一頁</button><button onclick="ui.productPage=Math.min(${pages},ui.productPage+1);renderProductResults()" class="px-3 py-1 rounded-md border border-slate-300 dark:border-slate-700 disabled:opacity-40" ${ui.productPage>=pages?'disabled':''}>下一頁</button></div></div>`:''}`;
}
function sortProducts(k){ if(ui.productSort.key===k)ui.productSort.dir=ui.productSort.dir==='asc'?'desc':'asc'; else ui.productSort={key:k,dir:'asc'}; renderProductResults(); }

/* ===== 分類 / 品牌（相同 UI 樣式） ===== */
function simpleListView(kind){
  const isCat=kind==='cat';
  const coll=isCat?store.categories:store.brands;
  const items=coll.filter(c=>!c.isDeleted);
  const title=isCat?'分類清單':'品牌清單';
  const addFn=isCat?'openCategoryModal()':'openBrandModal()';
  const editFn=isCat?'openCategoryModal':'openBrandModal';
  const delFn=isCat?'deleteCategory':'deleteBrand';
  const countOf=id=>store.products.filter(p=>!p.isDeleted && (isCat?p.categoryId:p.brandId)===id).length;
  return `<div class="max-w-2xl"><div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
    <div class="p-4 flex items-center justify-between border-b border-slate-100 dark:border-slate-800"><div class="font-semibold">${title}</div><button onclick="${addFn}" class="inline-flex items-center gap-1.5 bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-sm font-medium">${icon(IC.plus,'w-4 h-4')} ${isCat?'新增分類':'新增品牌'}</button></div>
    <ul class="divide-y divide-slate-100 dark:divide-slate-800">
    ${items.length?items.map(c=>`<li class="px-4 py-3 flex items-center justify-between"><div><span class="font-medium">${esc(c.name)}</span> <span class="text-xs text-slate-400 ml-2">${countOf(c.id)} 項商品</span></div><div class="flex gap-1"><button onclick="${editFn}('${c.id}')" class="p-1.5 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">${icon(IC.edit,'w-4 h-4')}</button><button onclick="${delFn}('${c.id}')" class="p-1.5 rounded-md hover:bg-rose-50 dark:hover:bg-rose-900/30 text-rose-500">${icon(IC.trash,'w-4 h-4')}</button></div></li>`).join(''):`<li class="px-4 py-12 text-center text-slate-400">${isCat?'尚無分類，例如：電子零件、五金、耗材。':'尚無品牌，例如：自有品牌、國際牌、原廠。'}</li>`}
    </ul></div></div>`;
}
function viewCategories(){ return simpleListView('cat'); }
function viewBrands(){ return simpleListView('brand'); }

function viewBatches(){
  const rows=store.batches.filter(b=>!b.isDeleted).slice().sort((a,b)=>a.createdAt<b.createdAt?1:-1);
  return `<div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
    <div class="p-4 flex items-center justify-between border-b border-slate-100 dark:border-slate-800"><div class="font-semibold">所有進貨批次</div><button onclick="openPurchaseModal()" class="inline-flex items-center gap-1.5 bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-sm font-medium">${icon(IC.plus,'w-4 h-4')} 新增進貨</button></div>
    <div class="overflow-x-auto"><table class="w-full text-sm">
      <thead class="bg-slate-50 dark:bg-slate-800/50 border-b border-slate-100 dark:border-slate-800 text-slate-500 dark:text-slate-400"><tr>${['進貨單號','進貨日期','商品','廠商','成本','進貨量','剩餘量','備註'].map(h=>`<th class="px-3 py-2.5 text-left font-semibold whitespace-nowrap">${h}</th>`).join('')}</tr></thead>
      <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
      ${rows.length?rows.map(b=>{ const p=productById(b.productId),used=b.remainingQty<b.qty;
        return `<tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40"><td class="px-3 py-2.5 font-mono text-xs whitespace-nowrap">${esc(b.code)}</td><td class="px-3 py-2.5 whitespace-nowrap">${fmtDate(b.purchaseDate)}</td><td class="px-3 py-2.5"><span class="font-mono text-xs text-slate-400">${esc(p?.code||'')}</span> ${esc(p?.name||'（已刪除）')}</td><td class="px-3 py-2.5 text-slate-500">${esc(b.vendorName||'—')}</td><td class="px-3 py-2.5 num whitespace-nowrap">${nt(b.unitCost)}</td><td class="px-3 py-2.5 num">${b.qty}</td><td class="px-3 py-2.5 num font-semibold ${b.remainingQty===0?'text-slate-400':used?'text-amber-600 dark:text-amber-400':'text-brand-600 dark:text-brand-300'}">${b.remainingQty}</td><td class="px-3 py-2.5 text-slate-500">${esc(b.note||'')}</td></tr>`;
      }).join(''):`<tr><td colspan="8" class="px-3 py-16 text-center text-slate-400">尚無進貨批次。</td></tr>`}
      </tbody></table></div></div>`;
}
function viewMovements(){
  let rows=store.movements.slice().sort((a,b)=>a.createdAt<b.createdAt?1:-1);
  if(!ui.moveShowDeleted) rows=rows.filter(m=>!m.isDeleted);
  if(ui.moveType) rows=rows.filter(m=>m.type===ui.moveType);
  if(ui.moveProduct) rows=rows.filter(m=>m.productId===ui.moveProduct);
  const badge=t=>t==='進貨'?'bg-brand-100 dark:bg-brand-900/50 text-brand-700 dark:text-brand-200':t==='出貨'?'bg-sky-100 dark:bg-sky-900/50 text-sky-700 dark:text-sky-200':t==='初始建立'?'bg-violet-100 dark:bg-violet-900/50 text-violet-700 dark:text-violet-200':'bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-200';
  return `<div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
    <div class="p-4 flex flex-wrap items-center gap-2 border-b border-slate-100 dark:border-slate-800"><div class="font-semibold mr-auto">庫存異動紀錄 <span class="text-xs font-normal text-slate-400">（刪除會同步回復庫存）</span></div>
      <label class="flex items-center gap-1.5 text-sm text-slate-500 cursor-pointer"><input type="checkbox" ${ui.moveShowDeleted?'checked':''} onchange="ui.moveShowDeleted=this.checked;render()"/> 顯示已刪除</label>
      <select onchange="ui.moveType=this.value;render()" class="rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-1.5 text-sm"><option value="">全部類型</option>${MOVE_TYPES.map(t=>`<option ${ui.moveType===t?'selected':''}>${t}</option>`).join('')}</select>
      <select onchange="ui.moveProduct=this.value;render()" class="rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-1.5 text-sm max-w-[180px]"><option value="">全部商品</option>${store.products.map(p=>`<option value="${p.id}" ${ui.moveProduct===p.id?'selected':''}>${esc(p.code)} ${esc(p.name)}</option>`).join('')}</select></div>
    <div class="overflow-x-auto"><table class="w-full text-sm">

/* ===== 報價單編輯器 ===== */
const DEFAULT_QUOTE_NOTES = '1. 報價有效期限至有效日期止，逾期請重新洽詢。\n2. 交期以雙方確認為準。\n3. 以上金額如未稅，開立發票時另加 5% 營業稅。\n4. 大量訂購另議。';
function blankQuoteItem(){ return {productId:null,code:'',name:'',price:0,qty:1,components:[]}; }
/* ===== 內部出貨明細（BOM）：客戶只看報價項目，內部展開成實際出貨品項 ===== */
function blankComp(){ return {productId:null,code:'',name:'',qty:1,unitCost:0,vendorName:''}; }
function latestBatchCost(pid){ const bs=batchesOf(pid).slice().sort((a,b)=> a.purchaseDate!==b.purchaseDate ? (a.purchaseDate<b.purchaseDate?1:-1) : ((a.createdAt||'')<(b.createdAt||'')?1:-1)); return bs.length?(Number(bs[0].unitCost)||0):0; }
function vendorOptions(){ return [...new Set([...store.batches.map(b=>b.vendorName),...store.products.map(p=>p.vendorName)].filter(Boolean))]; }
function compsOf(it){ return (it.components||[]).filter(c=>c.name||c.productId); }
function compUnitCost(it){ return compsOf(it).reduce((a,c)=>a+(Number(c.qty)||0)*(Number(c.unitCost)||0),0); }
function quoteInternalCost(q){ return (q.items||[]).reduce((s,it)=>s+compUnitCost(it)*(Number(it.qty)||0),0); }
function expandQuoteItemsToShipItems(q){
  const out=[];
  (q.items||[]).filter(it=>it.name||it.productId).forEach(it=>{
    const comps=compsOf(it); const lineQty=Number(it.qty)||0;
    if(comps.length){
      comps.forEach(c=>out.push({productId:c.productId||null,code:c.code||'',name:c.name,qty:(Number(c.qty)||0)*lineQty,
        unitCost:Number(c.unitCost)||0,vendorName:c.vendorName||'',srcLabel:it.name}));
    } else {
      out.push({productId:it.productId||null,code:it.code||'',name:it.name,qty:lineQty,
        unitCost:it.productId?latestBatchCost(it.productId):0,
        vendorName:it.productId?(productById(it.productId)?.vendorName||''):'',srcLabel:''});
    }
  });
  return out;
}

function syncQuoteHeader(){ const g=id=>document.getElementById(id)?.value ?? '';
  draftQuote.customerSnapshot={ name:g('q-cname'),contact:g('q-ccontact'),phone:g('q-cphone'),taxId:g('q-ctax'),address:g('q-caddr') };
  draftQuote.quoteDate=g('q-date'); draftQuote.validDate=g('q-valid'); draftQuote.applyNo=g('q-apply'); draftQuote.sales=g('q-sales'); }
function readQuoteItemsFromDOM(){
  draftQuote.items.forEach((it,i)=>{ const prod=document.getElementById(`qi-${i}-prod`),name=document.getElementById(`qi-${i}-name`),price=document.getElementById(`qi-${i}-price`),qty=document.getElementById(`qi-${i}-qty`);
    if(prod) it.productId=prod.value||null; if(name) it.name=name.value; if(price) it.price=Number(price.value)||0; if(qty) it.qty=Number(qty.value)||0;
    if(it.productId){ const p=productById(it.productId); if(p) it.code=p.code; } else it.code=''; }); }
function liveQuote(){ readQuoteItemsFromDOM(); let untaxed=0;
  draftQuote.items.forEach((it,i)=>{ const sub=(Number(it.qty)||0)*(Number(it.price)||0); untaxed+=sub; const cell=document.getElementById(`qi-${i}-sub`); if(cell)cell.textContent=nt(sub); });
  const tax=draftQuote.taxable?Math.round(untaxed*0.05):0; const set=(id,v)=>{ const e=document.getElementById(id); if(e)e.textContent=nt(v); };
  set('q-untaxed',untaxed); set('q-tax',tax); set('q-total',untaxed+tax);
  const ic=quoteInternalCost(draftQuote); set('q-cost',ic);
  const mEl=document.getElementById('q-margin');
  if(mEl){ const m=untaxed-ic; mEl.textContent=nt(m)+(untaxed>0&&ic>0?`（${Math.round(m/untaxed*100)}%）`:''); mEl.className='num font-semibold '+(m<0?'text-rose-600 dark:text-rose-400':'text-slate-700 dark:text-slate-200'); } }
function onQuoteProduct(i){ const sel=document.getElementById(`qi-${i}-prod`); const pid=sel.value;
  if(pid){ const p=productById(pid); draftQuote.items[i].productId=pid; draftQuote.items[i].name=p.name; draftQuote.items[i].price=p.price; draftQuote.items[i].code=p.code; document.getElementById(`qi-${i}-name`).value=p.name; document.getElementById(`qi-${i}-price`).value=p.price; }
  else { draftQuote.items[i].productId=null; draftQuote.items[i].code=''; } liveQuote(); }
function onQuoteCustomer(cid){ syncQuoteHeader(); readQuoteItemsFromDOM(); draftQuote.customerId=cid; const c=customerById(cid);
  if(c) draftQuote.customerSnapshot={ name:c.companyName,contact:c.contact||'',phone:c.phone||'',taxId:c.taxId||'',address:c.address||'' }; render(); }
function addQuoteItem(){ syncQuoteHeader(); readQuoteItemsFromDOM(); draftQuote.items.push(blankQuoteItem()); render(); }
function removeQuoteItem(i){ syncQuoteHeader(); readQuoteItemsFromDOM(); draftQuote.items.splice(i,1); if(draftQuote.items.length===0)draftQuote.items.push(blankQuoteItem()); render(); }
async function saveQuote(thenPrint){
  syncQuoteHeader(); readQuoteItemsFromDOM();
  draftQuote.items=draftQuote.items.filter(it=>it.name||it.productId);
  if(draftQuote.items.length===0){ alert('請至少新增一列報價明細'); draftQuote.items.push(blankQuoteItem()); return; }
  if(!draftQuote.customerSnapshot.name){ alert('請選擇或輸入客戶名稱'); return; }
  const now=nowISO();
  if(draftQuote._isNew && !draftQuote.no){ draftQuote.no=await nextNo('Q',{year:new Date().getFullYear(),pad:5}); draftQuote.createdAt=now; draftQuote.createdBy=operator||'（未設定）'; }
  draftQuote.updatedAt=now; draftQuote.updatedBy=operator||'（未設定）'; draftQuote.isDeleted=false;
  const clean=JSON.parse(JSON.stringify(draftQuote)); delete clean._isNew;
  const idx=store.quotes.findIndex(q=>q.id===clean.id); if(idx>=0)store.quotes[idx]=clean; else store.quotes.push(clean);
  await dalPut('quotes',clean); const id=clean.id; draftQuote=null;
  if(thenPrint){ currentView='quotes'; render(); printQuote(id); } else { go('quotes'); }
}
async function deleteQuote(id){ const q=store.quotes.find(x=>x.id===id); if(!confirm(`確定刪除報價單「${q.no}」？（軟刪除）`))return; q.isDeleted=true; q.updatedAt=nowISO(); await dalPut('quotes',q); render(); }

        </div></td></tr>`;
    }).join(''):`<tr><td colspan="7" class="px-3 py-16 text-center text-slate-400">${store.shipments.filter(s=>!s.isDeleted).length===0?'尚無出貨單。可從報價單「建立出貨單」或直接新增。':'沒有符合條件的出貨單。'}</td></tr>`}

function shipPaymentText(s){ if(s.paymentMethod) return s.paymentMethod; if(s.payments){ const on=Object.keys(s.payments).filter(k=>s.payments[k]); if(on.length) return on.join('、'); } return '—'; }

    attachments:{}, attachOther:'', remark:'請附：報價單、廠商訂單、相關資料',
    urgent:{notified:false,date:'',time:''}, items:[], status:'草稿', stockDeducted:false, _isNew:true };

function blankShipItem(){ return {productId:null,code:'',name:'',qty:1,unitCost:0,vendorName:'',srcLabel:''}; }
function shipInternalCost(s){ return (s.items||[]).reduce((a,it)=>a+(Number(it.unitCost)||0)*(Number(it.qty)||0),0); }
function applyCustomerDefaults(ship,cust){ if(!cust)return; ship.deliveryMethod=cust.defaultDelivery||''; ship.invoiceDelivery=cust.defaultInvoiceDelivery||''; ship.paymentMethod=cust.defaultPayment||''; }
function newShipment(){ draftShip=blankShip(); draftShip.items=[blankShipItem()]; currentView='shipEdit'; render(); }
function editShipment(id){ const s=store.shipments.find(x=>x.id===id); if(!s)return; draftShip=JSON.parse(JSON.stringify(s)); draftShip._isNew=false; currentView='shipEdit'; render(); }
function openShipmentById(id){ editShipment(id); }
async function convertToShipment(quoteId){
  const q=store.quotes.find(x=>x.id===quoteId); if(!q)return;
  if(q.shipmentId){ if(confirm('此報價已有出貨單，是否開啟？')) editShipment(q.shipmentId); return; }
  draftShip=blankShip();
  draftShip.quoteId=q.id; draftShip.companyId=q.companyId; draftShip.customerId=q.customerId;
  draftShip.customerSnapshot=JSON.parse(JSON.stringify(q.customerSnapshot||{}));
  applyCustomerDefaults(draftShip, customerById(q.customerId));
  draftShip.items=expandQuoteItemsToShipItems(q);
  if(!draftShip.items.length) draftShip.items=[blankShipItem()];
  currentView='shipEdit'; render();
}

function syncShipHeader(){ const g=id=>document.getElementById(id)?.value ?? '';
  draftShip.customerSnapshot.name=g('s-cname'); draftShip.customerSnapshot.phone=g('s-cphone'); draftShip.customerSnapshot.taxId=g('s-ctax'); draftShip.customerSnapshot.address=g('s-caddr');
  draftShip.deliveryUnit=g('s-unit'); draftShip.deliveryDate=g('s-ddate'); draftShip.invoiceDate=g('s-idate');
  draftShip.deliveryMethod=g('s-dmethod'); draftShip.invoiceDelivery=g('s-invdeliv'); draftShip.paymentMethod=g('s-pay');
  if(document.getElementById('s-udate')) draftShip.urgent.date=g('s-udate');
  if(document.getElementById('s-utime')) draftShip.urgent.time=g('s-utime'); }
function readShipItems(){ draftShip.items.forEach((it,i)=>{ const g=id=>document.getElementById(`si-${i}-${id}`);
  const pr=g('prod'),nm=g('name'),qt=g('qty'),cs=g('cost'),vd=g('vendor');
  if(pr) it.productId=pr.value||null; if(nm) it.name=nm.value; if(qt) it.qty=Number(qt.value)||0;
  if(cs) it.unitCost=Number(cs.value)||0; if(vd) it.vendorName=vd.value;
  if(it.productId){const p=productById(it.productId); if(p)it.code=p.code;} else it.code=''; }); }
function liveShipCost(){ const e=document.getElementById('s-costtotal'); if(e) e.textContent=nt(shipInternalCost(draftShip)); }
function onShipProduct(i){ syncShipHeader(); readShipItems(); const pid=document.getElementById(`si-${i}-prod`).value;
  if(pid){ const p=productById(pid); const it=draftShip.items[i];
    it.productId=pid; it.name=p.name; it.code=p.code;
    const bc=latestBatchCost(pid); if(bc) it.unitCost=bc;
    if(p.vendorName) it.vendorName=p.vendorName;
  } else { draftShip.items[i].productId=null; }
  render(); }
function onShipCustomer(cid){ syncShipHeader(); readShipItems(); draftShip.customerId=cid; const c=customerById(cid); if(c){ draftShip.customerSnapshot={name:c.companyName,contact:c.contact||'',phone:c.phone||'',taxId:c.taxId||'',address:c.address||''}; applyCustomerDefaults(draftShip,c); } render(); }
function addShipItem(){ syncShipHeader(); readShipItems(); draftShip.items.push(blankShipItem()); render(); }
function removeShipItem(i){ syncShipHeader(); readShipItems(); draftShip.items.splice(i,1); if(draftShip.items.length===0)draftShip.items.push(blankShipItem()); render(); }
async function saveShipment(mode){
  syncShipHeader(); readShipItems();
  draftShip.items=draftShip.items.filter(it=>it.name||it.productId);
  if(draftShip.items.length===0){ alert('請至少新增一列出貨明細'); draftShip.items.push(blankShipItem()); return; }
  if(!draftShip.customerSnapshot.name){ alert('請輸入客戶名稱'); return; }
  const now=nowISO();
  if(draftShip._isNew && !draftShip.no){ draftShip.no=await nextNo('D',{year:new Date().getFullYear(),pad:5}); draftShip.createdAt=now; draftShip.createdBy=operator||'（未設定）'; }
  draftShip.updatedAt=now; draftShip.updatedBy=operator||'（未設定）'; draftShip.isDeleted=false;
  if(mode==='confirm'){
    if(!confirm('確認出貨後將依 FIFO 從批次扣除庫存，且不可再修改明細。是否繼續？')) return;
    try { await confirmShipment(draftShip); } catch(e){ alert(e.message); await persistShip(); render(); return; }
  }
  await persistShip();
  const id=draftShip.id, wasConfirm=mode==='confirm'; draftShip=null; go('shipments');
  if(wasConfirm) setTimeout(()=>printShipment(id),100);
}
async function undoShipment(){
  if(!draftShip||!draftShip.stockDeducted) return;
  if(!confirm(`是否確定取消出貨單「${draftShip.no}」？\n\n此操作將回復本單造成的所有庫存變化（庫存加回原批次），出貨單將退回「草稿」可再編輯，且無法復原。`)) return;
  try{ const n=await reverseShipment(draftShip); alert(`已回復 ${n} 筆庫存異動，出貨單已退回草稿。`); }
  catch(e){ alert(e.message); return; }
  render();
}
async function persistShip(){ const clean=JSON.parse(JSON.stringify(draftShip)); delete clean._isNew; const i=store.shipments.findIndex(s=>s.id===clean.id); if(i>=0)store.shipments[i]=clean; else store.shipments.push(clean); await dalPut('shipments',clean);
  if(clean.quoteId){ const q=store.quotes.find(x=>x.id===clean.quoteId); if(q && q.shipmentId!==clean.id){ q.shipmentId=clean.id; await dalPut('quotes',q); } } }
async function deleteShipment(id){ const s=store.shipments.find(x=>x.id===id); if(s.stockDeducted){ alert('此出貨單已確認並扣過庫存，為保留紀錄不可刪除。'); return; } if(!confirm(`確定刪除出貨單「${s.no}」？（軟刪除）`))return; s.isDeleted=true; s.updatedAt=nowISO(); await dalPut('shipments',s); if(s.quoteId){const q=store.quotes.find(x=>x.id===s.quoteId); if(q&&q.shipmentId===s.id){q.shipmentId=null; if(q.status==='已出貨')q.status='已送出'; await dalPut('quotes',q);} } render(); }

async function saveProduct(id){
  const name=document.getElementById('f-name').value.trim(); if(!name){alert('請輸入產品名稱');return;}
  const type=readProductType();
  const data={ name, type, categoryId:document.getElementById('f-cat').value||'', brandId:document.getElementById('f-brand').value||'', vendorName:document.getElementById('f-vendor').value.trim(), price:Number(document.getElementById('f-price').value)||0, minStock:type==='stock'?(Number(document.getElementById('f-min')?.value)||0):0, note:document.getElementById('f-note').value.trim() };
  if(id){ const p=productById(id);
    if(isStockProduct(p) && type==='nonstock' && stockOf(id)>0){ alert(`「${p.name}」目前還有庫存 ${stockOf(id)}，不可改為非庫存商品。\n請先出清或刪除相關庫存異動後再改。`); return; }

    <div class="grid grid-cols-2 gap-3">
      <div>${flabel('Logo')}<div class="mt-1 flex items-center gap-2"><div class="w-14 h-14 rounded border border-slate-200 dark:border-slate-700 grid place-items-center overflow-hidden bg-slate-50 dark:bg-slate-800"><img id="co-logo-prev" src="${c?.logo||''}" class="w-full h-full object-contain ${c?.logo?'':'hidden'}"/></div><input type="file" accept="image/*" onchange="readImg(event,'co-logo-prev')" class="text-xs"/></div></div>
      <div>${flabel('印章')}<div class="mt-1 flex items-center gap-2"><div class="w-14 h-14 rounded border border-slate-200 dark:border-slate-700 grid place-items-center overflow-hidden bg-slate-50 dark:bg-slate-800"><img id="co-stamp-prev" src="${c?.stamp||''}" class="w-full h-full object-contain ${c?.stamp?'':'hidden'}"/></div><input type="file" accept="image/*" onchange="readImg(event,'co-stamp-prev')" class="text-xs"/></div></div>
    </div>
    <div class="text-xs text-slate-400">Logo / 印章請上傳小圖（建議 < 300KB），會內嵌到報價單、出貨單。</div>
  </div>${modalFoot(`saveCompany('${id}')`)}`);
}
function readImg(ev,prevId){ const f=ev.target.files[0]; if(!f)return; if(f.size>1200000){ if(!confirm('圖片較大（>1MB），可能拖慢儲存，仍要使用嗎？')){ev.target.value='';return;} } const r=new FileReader(); r.onload=()=>{ const img=document.getElementById(prevId); img.src=r.result; img.classList.remove('hidden'); }; r.readAsDataURL(f); }
async function saveCompany(id){ const c=companyById(id); const name=document.getElementById('co-name').value.trim(); if(!name){alert('請輸入公司名稱');return;}
  c.name=name; c.taxId=document.getElementById('co-tax').value.trim(); c.phone=document.getElementById('co-phone').value.trim(); c.email=document.getElementById('co-email').value.trim(); c.address=document.getElementById('co-addr').value.trim(); c.bankInfo=document.getElementById('co-bank').value.trim();
  const logo=document.getElementById('co-logo-prev'); const stamp=document.getElementById('co-stamp-prev');
  c.logo=logo&&!logo.classList.contains('hidden')?logo.src:''; c.stamp=stamp&&!stamp.classList.contains('hidden')?stamp.src:'';
  c.updatedAt=nowISO(); await dalPut('companies',c); closeModal(); render();
}

function go(v){ currentView=v; if(v!=='quoteEdit')draftQuote=null; if(v!=='shipEdit')draftShip=null; render(); }

function toggleDark(){ const el=document.documentElement; el.classList.toggle('dark'); try{localStorage.setItem('erp_dark',el.classList.contains('dark')?'1':'0');}catch(e){} render(); }

}
