<script>

<script>
/* =======================================================================
   資料存取層：Firestore → localStorage → 記憶體
   ======================================================================= */
const COLLECTIONS = ['products','categories','brands','batches','movements','customers','companies','quotes','shipments','counters'];
let BACKEND='memory', db=null;
const mem={}; COLLECTIONS.forEach(c=>mem[c]=[]);

function lsOK(){ try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;} }

// 初始化資料庫連線
async function dalInit(){
  if (firebaseConfig && firebaseConfig.apiKey && window.firebase){
    try{ 
      firebase.initializeApp(firebaseConfig); 
      db = firebase.firestore(); 
      BACKEND = 'firestore'; 
      return; 
    }
    catch(e){ 
      console.warn('Firebase 初始化失敗，改用本機儲存', e); 
    }
  }
  BACKEND = lsOK() ? 'localStorage' : 'memory';
}

// 讀取指定集合的所有資料
async function dalList(c){
  if(BACKEND==='firestore'){ 
    // 使用獨立的 erp_ 前綴作為資料表集合名稱，防範資料與其他舊專案混淆
    const s = await db.collection('erp_' + c).get(); 
    return s.docs.map(d=>d.data()); 
  }
  if(BACKEND==='localStorage'){ 
    try{return JSON.parse(localStorage.getItem('erp_'+c)||'[]');}catch(e){return [];} 
  }
  return mem[c].slice();
}

// 儲存或更新單筆資料
async function dalPut(c,obj){
  if(BACKEND==='firestore'){ 
    await db.collection('erp_' + c).doc(String(obj.id)).set(JSON.parse(JSON.stringify(obj))); 
    return obj; 
  }
  const arr = BACKEND==='localStorage' ? JSON.parse(localStorage.getItem('erp_'+c)||'[]') : mem[c];
  const i=arr.findIndex(x=>x.id===obj.id); if(i>=0)arr[i]=obj; else arr.push(obj);
  if(BACKEND==='localStorage') localStorage.setItem('erp_'+c, JSON.stringify(arr));
  return obj;
}

/* ===== 狀態 ===== */
const store={}; COLLECTIONS.forEach(c=>store[c]=[]);
let operator = (typeof localStorage!=='undefined' && localStorage.getItem('erp_operator')) || '';
let currentView='products';
let draftQuote=null, draftShip=null;

// 系統核心初始化與首次載入
async function loadAll(){ 
  for(const c of COLLECTIONS) store[c]=await dalList(c); 
}

/* ===== 工具 ===== */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowISO=()=>new Date().toISOString();
const pad=(n,l)=>String(n).padStart(l,'0');
function debounce(fn,ms){ let t; return function(){ clearTimeout(t); t=setTimeout(fn,ms); }; }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`; }
function addDaysStr(base,days){ const d=new Date(base+'T00:00:00'); d.setDate(d.getDate()+days); return `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`; }
function fmtDate(s){ if(!s)return'—'; const d=s.length>10?new Date(s):new Date(s+'T00:00:00'); if(isNaN(d))return s; return `${d.getFullYear()}/${pad(d.getMonth()+1,2)}/${pad(d.getDate(),2)}`; }
function fmtDT(s){ if(!s)return'—'; const d=new Date(s); if(isNaN(d))return s; return `${d.getFullYear()}/${pad(d.getMonth()+1,2)}/${pad(d.getDate(),2)} ${pad(d.getHours(),2)}:${pad(d.getMinutes(),2)}`; }
function nt(n){ return 'NT$ '+(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2}); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
async function nextNo(prefix,{year=null,pad:p=5}={}){
  const name=year?`${prefix}${year}`:prefix;
  let c=store.counters.find(x=>x.id===name); if(!c){c={id:name,value:0};store.counters.push(c);}
  c.value++; await dalPut('counters',c);
  return year?`${prefix}${year}${pad(c.value,p)}`:`${prefix}${pad(c.value,p)}`;
}
const batchesOf=id=>store.batches.filter(b=>b.productId===id && !b.isDeleted);
const stockOf(id)=>batchesOf(id).reduce((s,b)=>s+(b.remainingQty||0),0);
const catName=id=>{ const c=store.categories.find(x=>x.id===id); return c?c.name:'—'; };
const brandName=id=>{ const b=store.brands.find(x=>x.id===id); return b?b.name:'—'; };
const productById=id=>store.products.find(p=>p.id===id);
const isStockProduct=p=>!!p && (p.type||'stock')==='stock';
const isStockPid=id=>isStockProduct(productById(id));
const stockText=p=>isStockProduct(p)?String(stockOf(p.id)):'非庫存';
const customerById=id=>store.customers.find(c=>c.id===id);
const companyById=id=>store.companies.find(c=>c.id===id);

/* ===== FIFO 引擎 ===== */
function computeFifoDeduction(batches,qtyNeeded){
  const sorted=batches.filter(b=>b.remainingQty>0).sort((a,b)=> a.purchaseDate!==b.purchaseDate ? (a.purchaseDate<b.purchaseDate?-1:1) : (a.createdAt||0)-(b.createdAt||0));
  let need=qtyNeeded; const consumptions=[];
  for(const b of sorted){ if(need<=0)break; const take=Math.min(b.remainingQty,need); if(take>0){consumptions.push({batch:b,qty:take,unitCost:b.unitCost});need-=take;} }
  return { ok:need<=0, consumptions, shortage:Math.max(0,need) };
}
async function addMovement(m){ const rec=Object.assign({id:uid(),createdAt:nowISO(),operator:operator||'（未設定）'},m); store.movements.push(rec); await dalPut('movements',rec); return rec; }
async function touchProduct(p){ p.updatedAt=nowISO(); p.updatedBy=operator||'（未設定）'; await dalPut('products',p); }
async function doPurchase({productId,vendorName,purchaseDate,unitCost,qty,note}){
  const p=productById(productId); if(!p) throw new Error('找不到商品');
  if(!isStockProduct(p)) throw new Error(`「${p.name}」是非庫存商品，不需建立進貨批次。`);
  const code=await nextNo('I',{year:new Date().getFullYear(),pad:5});
  const before=stockOf(productId);
  const batch={id:uid(),code,productId,vendorName:vendorName||'',purchaseDate,unitCost:Number(unitCost)||0,qty:Number(qty),remainingQty:Number(qty),note:note||'',isDeleted:false,createdAt:nowISO(),createdBy:operator||'（未設定）'};
  store.batches.push(batch); await dalPut('batches',batch); await touchProduct(p);
  await addMovement({date:purchaseDate,productId,productCode:p.code,productName:p.name,type:'進貨',qty:Number(qty),stockBefore:before,stockAfter:before+Number(qty),sourceNo:code,batchId:batch.id,batchCode:code,unitCost:Number(unitCost)||0,reason:note||''});
  return batch;
}
async function doDeduct({productId,qty,type,sourceNo,reason}){
  const p=productById(productId); if(!p) throw new Error('找不到商品'); qty=Number(qty);
  if(!isStockProduct(p)) throw new Error(`「${p.name}」是非庫存商品，不管理庫存。`);
  const plan=computeFifoDeduction(batchesOf(productId),qty);
  if(!plan.ok) throw new Error(`「${p.name}」庫存不足，尚缺 ${plan.shortage} 個（目前 ${stockOf(productId)}）`);
  let run=stockOf(productId);
  for(const c of plan.consumptions){
    c.batch.remainingQty-=c.qty; await dalPut('batches',c.batch);
    const before=run; run-=c.qty;
    await addMovement({date:todayStr(),productId,productCode:p.code,productName:p.name,type,qty:-c.qty,stockBefore:before,stockAfter:run,sourceNo:sourceNo||'',batchId:c.batch.id,batchCode:c.batch.code,unitCost:c.unitCost,reason:reason||''});
  }
  await touchProduct(p); return plan;
}
async function doPositiveAdjust({productId,qty,unitCost,reason}){
  const p=productById(productId); if(!isStockProduct(p)) throw new Error(`「${p?.name||''}」是非庫存商品，不管理庫存。`);
  qty=Number(qty); const before=stockOf(productId);
  const batch={id:uid(),code:'ADJ',productId,vendorName:'',purchaseDate:todayStr(),unitCost:Number(unitCost)||0,qty,remainingQty:qty,note:'庫存調整（增加）',isDeleted:false,createdAt:nowISO(),createdBy:operator||'（未設定）'};
  store.batches.push(batch); await dalPut('batches',batch); await touchProduct(p);
  await addMovement({date:todayStr(),productId,productCode:p.code,productName:p.name,type:'調整',qty,stockBefore:before,stockAfter:before+qty,sourceNo:'',batchId:batch.id,batchCode:'ADJ',unitCost:Number(unitCost)||0,reason:reason||''});
}
async function createInitialStock(p,qty,unitCost,note){
  qty=Number(qty)||0; if(qty<=0) return null;
  if(!isStockProduct(p)) return null;
  const before=stockOf(p.id);
  const batch={id:uid(),code:'INIT',productId:p.id,vendorName:p.vendorName||'',purchaseDate:todayStr(),unitCost:Number(unitCost)||0,qty,remainingQty:qty,note:note||'初始建立',isDeleted:false,createdAt:nowISO(),createdBy:operator||'（未設定）'};
  store.batches.push(batch); await dalPut('batches',batch);
  await addMovement({date:todayStr(),productId:p.id,productCode:p.code,productName:p.name,type:'初始建立',qty,stockBefore:before,stockAfter:before+qty,sourceNo:'',batchId:batch.id,batchCode:'INIT',unitCost:Number(unitCost)||0,reason:note||'初始建立庫存'});
  return batch;
}

async function confirmShipment(sh){
  if(sh.stockDeducted) throw new Error('此出貨單已確認並扣過庫存，不可重複扣。');
  const tracked=sh.items.filter(it=>it.productId && isStockPid(it.productId));
  const demand={};
  tracked.forEach(it=>{ demand[it.productId]=(demand[it.productId]||0)+(Number(it.qty)||0); });
  for(const pid of Object.keys(demand)){
    const plan=computeFifoDeduction(batchesOf(pid).map(b=>({...b})),demand[pid]);
    if(!plan.ok){ const p=productById(pid); throw new Error(`「${p?.name||pid}」庫存不足：本單需要 ${demand[pid]}，現有 ${stockOf(pid)}，尚缺 ${plan.shortage}。整張出貨單未扣庫存。`); }
  }
  for(const it of tracked){ await doDeduct({productId:it.productId,qty:Number(it.qty),type:'出貨',sourceNo:sh.no,reason:sh.customerSnapshot?.name||''}); }
  sh.stockDeducted=true; sh.status='已確認出貨'; sh.updatedAt=nowISO(); sh.updatedBy=operator||'（未設定）';
  await dalPut('shipments',sh);
  if(sh.quoteId){ const q=store.quotes.find(x=>x.id===sh.quoteId); if(q){ q.status='已出貨'; await dalPut('quotes',q); } }
}

function batchInMovement(batchId){ return store.movements.find(m=>m.batchId===batchId && !m.isDeleted && m.qty>0); }
function batchUsedQty(b){ return b.qty-b.remainingQty; }
async function updateBatch(batchId,patch){
  const b=store.batches.find(x=>x.id===batchId); if(!b||b.isDeleted) throw new Error('找不到批次。');
  const used=batchUsedQty(b);
  const newQty=patch.qty!==undefined?Number(patch.qty):b.qty;
  const newPid=patch.productId!==undefined?patch.productId:b.productId;
  if(!(newQty>0)) throw new Error('進貨數量必須大於 0。');
  if(newQty<used) throw new Error(`此批次已有 ${used} 個被扣用，數量不可小於 ${used}。`);
  if(newPid!==b.productId){
    if(used>0) throw new Error(`此批次已有 ${used} 個被扣用，不可更換商品。`);
    const np=productById(newPid); if(!np) throw new Error('找不到新商品。');
    if(!isStockProduct(np)) throw new Error(`「${np.name}」是非庫存商品，不可作為進貨批次的商品。`);
  }
  const oldPid=b.productId; b.productId=newPid; b.remainingQty=b.remainingQty+(newQty-b.qty); b.qty=newQty;
  if(patch.unitCost!==undefined) b.unitCost=Number(patch.unitCost)||0;
  if(patch.purchaseDate!==undefined) b.purchaseDate=patch.purchaseDate;
  if(patch.vendorName!==undefined) b.vendorName=patch.vendorName;
  if(patch.note!==undefined) b.note=patch.note;
  b.updatedAt=nowISO(); b.updatedBy=operator||'（未設定）';
  await dalPut('batches',b);
  const m=batchInMovement(batchId);
  if(m){ const np=productById(b.productId); m.productId=b.productId; m.productCode=np?np.code:''; m.productName=np?np.name:''; m.qty=b.qty; m.unitCost=b.unitCost; m.date=b.purchaseDate; m.stockAfter=(Number(m.stockBefore)||0)+b.qty; m.reason=(b.note||'')+`（${fmtDT(nowISO())} 修改）`; m.editedAt=nowISO(); m.editedBy=operator||'（未設定）'; await dalPut('movements',m); }
  const p1=productById(oldPid); if(p1) await touchProduct(p1);
  if(newPid!==oldPid){ const p2=productById(newPid); if(p2) await touchProduct(p2); }
  return b;
}
async function deleteBatch(batchId){
  const b=store.batches.find(x=>x.id===batchId); if(!b||b.isDeleted) return false;
  if(batchUsedQty(b)>0) throw new Error(`此批次已有元件被扣用，不可刪除。`);
  b.isDeleted=true; b.updatedAt=nowISO(); b.updatedBy=operator||'（未設定）'; await dalPut('batches',b);
  const m=batchInMovement(batchId); if(m){ m.isDeleted=true; m.deletedAt=nowISO(); m.deletedBy=operator||'（未設定）'; await dalPut('movements',m); }
  const p=productById(b.productId); if(p) await touchProduct(p);
  return true;
}

async function deleteMovement(id){
  const m=store.movements.find(x=>x.id===id); if(!m||m.isDeleted) return;
  if(m.sourceNo){
    const sh=store.shipments.find(x=>x.no===m.sourceNo && !x.isDeleted && x.stockDeducted);
    if(sh){ alert(`此筆異動來自出貨單「${sh.no}」，請到出貨管理取消整張單。`); return; }
  }
  const b=store.batches.find(x=>x.id===m.batchId);
  if(!b || b.isDeleted){ alert('找不到對應進貨批次。'); return; }
  if(m.qty>0){
    if(b.qty-b.remainingQty>0){ alert(`該批次已有後續扣用，無法刪除。`); return; }
    if(!confirm(`確定刪除此筆異動？將移除整個進貨批次。`)) return;
    b.isDeleted=true; await dalPut('batches',b);
  } else {
    const back=-m.qty; if(b.remainingQty+back>b.qty){ alert('資料異常。'); return; }
    if(!confirm(`確定刪除此筆出庫異動？庫存將回補至批次 ${b.code}。`)) return;
    b.remainingQty+=back; await dalPut('batches',b);
  }
  m.isDeleted=true; m.deletedAt=nowISO(); m.deletedBy=operator||'（未設定）'; await dalPut('movements',m);
  const p=productById(m.productId); if(p) await touchProduct(p);
  render();
}

async function reverseShipment(sh){
  if(!sh.stockDeducted) throw new Error('尚未確認扣庫存。');
  const ms=store.movements.filter(m=>!m.isDeleted && m.sourceNo===sh.no && m.type==='出貨');
  for(const m of ms){
    const b=store.batches.find(x=>x.id===m.batchId);
    if(!b||b.isDeleted) throw new Error('批次已不存在，無法回復。');
  }
  for(const m of ms){
    const b=store.batches.find(x=>x.id===m.batchId); b.remainingQty+=(-m.qty); await dalPut('batches',b);
    m.isDeleted=true; m.deletedAt=nowISO(); m.deletedBy=operator||'（未設定）'; await dalPut('movements',m);
  }
  sh.stockDeducted=false; sh.status='草稿'; sh.updatedAt=nowISO(); sh.updatedBy=operator||'（未設定）'; await dalPut('shipments',sh);
  if(sh.quoteId){ const q=store.quotes.find(x=>x.id===sh.quoteId); if(q && q.status==='已出貨'){ q.status='已送出'; await dalPut('quotes',q); } }
  return ms.length;
}

/* 後續其餘 ERP 介面與事件處理函式（保持原樣，僅在啟動時掛載連線）... */
// 由於原本的程式碼明細過長且未提供後半段（如表單 DOM 關閉等標籤），下方自動執行系統引導：

/* ===== 初始化啟動程序 ===== */
window.addEventListener('DOMContentLoaded', async () => {
  await dalInit(); // 第一步：偵測並建立 Firebase 連線
  await loadAll();  // 第二步：同步資料
  if(typeof render === 'function') render();
});

// 其餘 UI 輔助常數
const DELIVERY_METHODS=['宅配','自取','貨運','廠商配送','郵寄'];
const INVOICE_DELIVERY=['隨貨附','郵寄','Email','月結寄送','自取'];
const PAYMENT_METHODS=['收現','匯款','即期支票','附回郵','月結','月結30天','月結60天','貨到付款'];
const ATTACHMENTS=['出廠證明','入帳委託書','匯款資料','其他'];
